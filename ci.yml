name: CI

# Runs on every push and every PR — this does NOT deploy anything.
# Its only job is to block merging broken code. Deployment (CD) is a
# separate, later step once this is trustworthy.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test-backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check src/ app.py
        # NOTE: this will likely flag existing style issues the first
        # time it runs — that's expected and fine. Fix them as their
        # own separate, isolated change; don't let lint fixes get
        # mixed into unrelated feature work.

      - name: Run tests
        run: pytest tests/ -v

  test-frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        # Catches TypeScript errors and broken imports even without
        # a full test suite on the frontend yet.
